  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let attempts = 0;
      const lockTimer = setInterval(() => {
        attempts++;
        const gd = document.querySelector('.plotly-graph-div');
        if (gd && gd._fullLayout && gd._fullLayout.mapbox && gd._fullLayout.mapbox._subplot && gd._fullLayout.mapbox._subplot.map) {
          const map = gd._fullLayout.mapbox._subplot.map;
          map.setMinZoom(8.7);
          map.setMaxZoom(17.0);
          map.setMaxBounds([
            [76.35, 28.00], // Southwest boundary
            [77.80, 29.20]  // Northeast boundary
          ]);
          clearInterval(lockTimer);
        }
        if (attempts > 50) clearInterval(lockTimer);
      }, 150);
      
      // Theme Switcher Logic
      const htmlEl = document.documentElement;
      const themeBtns = document.querySelectorAll('.theme-toggle-btn');
      const sunIcons = document.querySelectorAll('.theme-icon-sun');
      const moonIcons = document.querySelectorAll('.theme-icon-moon');
      const savedTheme = localStorage.getItem('trustlayer-theme');
      const isDark = savedTheme === 'dark';

      function setTheme(dark) {
        if (dark) {
          htmlEl.classList.add('dark');
          sunIcons.forEach(i => i.classList.remove('hidden'));
          moonIcons.forEach(i => i.classList.add('hidden'));
        } else {
          htmlEl.classList.remove('dark');
          sunIcons.forEach(i => i.classList.add('hidden'));
          moonIcons.forEach(i => i.classList.remove('hidden'));
        }
      }

      setTheme(isDark);

      themeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          htmlEl.classList.add('theme-switching');
          const isDarkNow = htmlEl.classList.toggle('dark');
          localStorage.setItem('trustlayer-theme', isDarkNow ? 'dark' : 'light');
          setTheme(isDarkNow);
          
          window.requestAnimationFrame(() => {
            window.requestAnimationFrame(() => {
              htmlEl.classList.remove('theme-switching');
            });
          });
        });
      });
    });
  </script>
