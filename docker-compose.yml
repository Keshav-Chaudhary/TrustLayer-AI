version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustlayer_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATA_BACKEND=csv
      - VECTOR_BACKEND=chroma
      - VECTOR_STORE_PATH=/app/data/vector_store
      - CSV_DATASET_PATH=/app/data/exports/final_hotel_dataset.csv
      - OLLAMA_ENDPOINT=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5:7b-instruct
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trustlayer_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  # Optional PostgreSQL + pgvector container
  postgres:
    image: pgvector/pgvector:pg16
    container_name: trustlayer_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=trustlayer_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    profiles:
      - postgres

volumes:
  pgdata:
